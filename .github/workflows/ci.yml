name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GHC_VERSION: "9.10.3"
  CABAL_VERSION: "3.16.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Restore cache
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc${{ env.GHC_VERSION }}-${{ hashFiles('cuintet.cabal', 'cabal.project') }}
          restore-keys: ${{ runner.os }}-ghc${{ env.GHC_VERSION }}-

      - name: Build
        run: cabal build all

      - name: Unit tests
        run: cabal run unittests

      - name: Doctests
        run: cabal run doctests

      - name: Benchmarks
        run: cabal run bench

      - name: Generate SystemVerilog
        run: |
          cabal run clash -- Cuintet.Top.TangNano9k --systemverilog
          cabal run clash -- Cuintet.Top.Timing --systemverilog

      - name: Save cache
        uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ steps.cache.outputs.cache-primary-key }}
